# 检查 → 每个架构各在一台原生 runner 上构建 → 合并成多架构 manifest → 推到 GHCR。
#
# amd64 跑 ubuntu-latest，arm64 跑 ubuntu-24.04-arm：两个架构都是原生编译，
# 没有 QEMU 模拟。单架构作业只把自己那半张镜像按 digest 推上去（不带 tag），
# 最后由 merge 作业用 buildx imagetools 合成 manifest list，统一打 tag 推送。
#
# 只有推 v* tag 才发布；推 main 与 PR 只跑检查与构建，确认镜像还构建得出来。
# 发布的标签：v2.3.0 → 2.3.0、2.3、latest。预发布（v2.3.0-rc1）只出
# 2.3.0-rc1，不动 latest。
name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  # 打包前的检查：格式、依赖漏洞、前后端测试与构建。不过就不构建，更不发布。
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions 固定到 commit SHA（tag 可被移动），升级由 Dependabot 提 PR。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未 gofmt，请运行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
      # 前端工程（web/）：先装依赖并构建。产物不入库，而 Go 侧默认
      # go:embed webdist，必须在 CI 里现构建。
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web --no-audit --no-fund
      # 生产依赖（--omit=dev）的安全门禁；dev 依赖的漏洞随 dependabot 处理。
      - run: npm audit --prefix web --omit=dev --audit-level=high
      - run: npm --prefix web run lint
      - run: npm --prefix web run test
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run build
      - run: go vet ./...
      # 只阻断「本仓代码可达」的漏洞；不可达的依赖漏洞不红 CI，由 Dependabot 推动升级。
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      # 默认嵌入上面构建好的前端产物，覆盖托管逻辑与产物内容。
      - run: go test ./...
      # 编译检查：没有产物（webdist 里只有 .gitkeep）的全新克隆也照常编译。
      - run: go build ./...
      # 版本号写死在 main.go，tag 只是发布动作。两者不一致时，镜像的 tag 与
      # -version 输出会不符，排查时会得到错误版本信息。
      - name: tag 与 main.go 的 version 一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          want="${GITHUB_REF_NAME#v}"
          if ! grep -Eq "^[[:space:]]*version[[:space:]]*=[[:space:]]*\"${want}\"" main.go; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 main.go 里的 version 不一致，先递增 version 再打 tag"
            exit 1
          fi

  # 竞态检测单独成 job：跑到 race 失败时不必等前端构建，也不拖慢 check 的反馈。
  # 只覆盖并发最重的三个包，全仓 -race 会让 PR 反馈时间翻几倍。
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/core ./internal/antiad ./internal/store

  # 镜像漏洞是发布门禁（有 fixable HIGH/CRITICAL 就红），SBOM 是同作业产出的
  # 追溯材料。基线在 2026-11-24 扫描为 0（Go/Python/OS 全部无 fixable 高危）。
  supply-chain:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # 与发布镜像同一份 Dockerfile；只取 amd64，扫描结果按运行镜像的包集为准。
      - name: 构建待扫描镜像
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: menshen:scan
          cache-from: type=gha,scope=scan
          cache-to: type=gha,mode=max,scope=scan
      - name: 镜像漏洞扫描
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: menshen:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          scanners: vuln
          ignore-unfixed: true
          # SARIF 默认会写入所有级别；不限制的话 exit-code 会被 MEDIUM 触发。
          limit-severities-for-sarif: true
          exit-code: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-sarif
          path: trivy.sarif
          if-no-files-found: ignore
      - name: SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: menshen:scan
          format: spdx-json
          output-file: menshen.spdx.json
          artifact-name: menshen-sbom
          upload-artifact: true

  # 一台 runner 一个架构，只构建、只按 digest 推送自己那一半。
  image:
    needs: [check, race, supply-chain]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          # arm64 的托管 runner 目前只对公开仓库免费，这个仓库是公开的。
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 这一作业不产出 tag，meta 只用来给镜像带上版本相关的 label。
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # push-by-digest：只推镜像内容，不推 tag。tag 由 merge 作业打在合并后的
          # manifest list 上，否则两个架构会各自成一个带 tag 的单架构镜像。
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
          # 关掉 provenance：开着的话每次 by-digest 推送本身就是个 index（真镜像 +
          # 一条 attestation），合并后 manifest 里会多出 unknown/unknown 平台条目。
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          # gha 缓存按架构分 scope：两台 runner 并行导出，同 scope 会互相覆盖。
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: 留下 digest 给 merge 作业
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 两个架构的 digest 合成一个 manifest list，再统一打 tag 推送。只有发布才跑。
  merge:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true
      # imagetools 要连 registry 改 manifest，用不着 docker 引擎，但要 buildx。
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: 合成多架构 manifest 并打 tag
        working-directory: /tmp/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(-t "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      # 合并这一步出错往往不报错（如只收到一个 digest），因此追加一次校验。
      - name: 校验 manifest 里两个架构都在
        run: |
          docker buildx imagetools inspect --raw "$IMAGE:${{ steps.meta.outputs.version }}" > /tmp/manifest.json
          jq . /tmp/manifest.json
          archs=$(jq -r '.manifests[].platform.architecture' /tmp/manifest.json | sort | tr '\n' ' ')
          for want in amd64 arm64; do
            case " $archs " in
              *" $want "*) ;;
              *) echo "::error::${{ steps.meta.outputs.version }} 的 manifest 里没有 $want"; exit 1 ;;
            esac
          done
